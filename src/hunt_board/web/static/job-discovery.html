<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discover — Hunt Board</title>
  <link rel="stylesheet" href="/app/assets/app.css?v=20260721-2">
  <script type="module" src="/app/assets/pages/discovery.js?v=20260721-2"></script>
</head>
<body>
  <div data-app-nav="discover"></div>
  <main class="page-main discovery-content" id="main-content">
    <div class="page-shell">
      <header class="page-intro">
        <div>
          <p class="coordinate">Daily route / Live sightings ledger</p>
          <h1>Plot today’s route</h1>
          <p>Active listings arrive ranked and deduplicated. Open any row for the observation sheet.</p>
        </div>
        <span class="preview-label">Live API records</span>
      </header>
      <section aria-label="Job discovery controls">
        <div class="toolbar">
          <label class="search-field"><span class="sr-only">Search jobs</span><input type="search" data-search placeholder="Search title, company, or description"></label>
          <select class="select-field" data-location aria-label="Filter by location"><option value="">All locations</option><option value="remote">Remote only</option></select>
          <select class="select-field" data-country aria-label="Filter by country"><option value="">All countries</option></select>
          <select class="select-field" data-sort aria-label="Sort jobs"><option value="ranking_score:desc">Best match</option><option value="posted_at:desc">Newest posted</option><option value="first_seen_at:desc">Recently seen</option><option value="company_name:asc">Company A–Z</option><option value="title:asc">Title A–Z</option></select>
          <span class="results-note" data-count>Loading sightings…</span>
        </div>
        <div class="filter-tabs" data-tabs aria-label="Sighting filters"><button class="filter-button" aria-pressed="true" data-tab="all">All</button><button class="filter-button" aria-pressed="false" data-tab="new">New</button><button class="filter-button" aria-pressed="false" data-tab="saved">Saved</button><button class="filter-button" aria-pressed="false" data-tab="top">Top matches</button><button class="filter-button" aria-pressed="false" data-tab="discarded">Discard pile</button></div>
      </section>
      <section data-results class="ledger-wrap" aria-live="polite"></section>
    </div>
  </main>
  <aside class="observation-drawer" data-drawer aria-hidden="true" aria-label="Selected job observation sheet"></aside>
</body>
</html>
