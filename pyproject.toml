[project]
name = "hunt-board"
version = "0.2.0"
description = "Backend-first job intelligence system for curated ATS sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.scripts]
hunt-board = "hunt_board.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunt_board"]
