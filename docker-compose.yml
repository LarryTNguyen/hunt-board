services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hunt_board
      POSTGRES_USER: hunt_board
      POSTGRES_PASSWORD: hunt_board
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunt_board -d hunt_board"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hunt_board:hunt_board@postgres:5432/hunt_board
      HUNT_BOARD_SOURCES_PATH: data/sources.yaml
      HUNT_BOARD_DEFAULT_USER_EMAIL: ${HUNT_BOARD_DEFAULT_USER_EMAIL:-owner@example.com}
      HUNT_BOARD_HTTP_TIMEOUT_SECONDS: ${HUNT_BOARD_HTTP_TIMEOUT_SECONDS:-20}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m hunt_board.cli seed && uvicorn hunt_board.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
