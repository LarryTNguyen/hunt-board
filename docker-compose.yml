x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://hunt_board:hunt_board@postgres:5432/hunt_board
  HUNT_BOARD_SOURCES_PATH: data/sources.yaml
  HUNT_BOARD_DEFAULT_USER_EMAIL: ${HUNT_BOARD_DEFAULT_USER_EMAIL:-owner@example.com}
  HUNT_BOARD_ENVIRONMENT: ${HUNT_BOARD_ENVIRONMENT:-development}
  HUNT_BOARD_RELEASE: ${HUNT_BOARD_RELEASE:-development}
  HUNT_BOARD_DEPLOYMENT_ID: ${HUNT_BOARD_DEPLOYMENT_ID:-local-compose}
  HUNT_BOARD_PUBLIC_URL: ${HUNT_BOARD_PUBLIC_URL:-http://127.0.0.1:8000}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
  HUNT_BOARD_HTTP_TIMEOUT_SECONDS: ${HUNT_BOARD_HTTP_TIMEOUT_SECONDS:-30}
  HUNT_BOARD_SOURCE_CONCURRENCY: ${HUNT_BOARD_SOURCE_CONCURRENCY:-5}
  HUNT_BOARD_HTTP_MAX_RETRIES: ${HUNT_BOARD_HTTP_MAX_RETRIES:-2}
  HUNT_BOARD_HTTP_RETRY_BACKOFF_SECONDS: ${HUNT_BOARD_HTTP_RETRY_BACKOFF_SECONDS:-0.5}
  HUNT_BOARD_HTTP_RETRY_JITTER_SECONDS: ${HUNT_BOARD_HTTP_RETRY_JITTER_SECONDS:-0.25}
  HUNT_BOARD_RUN_TIMEOUT_SECONDS: ${HUNT_BOARD_RUN_TIMEOUT_SECONDS:-3600}
  HUNT_BOARD_STALE_RUN_MINUTES: ${HUNT_BOARD_STALE_RUN_MINUTES:-120}
  HUNT_BOARD_SCHEDULER_ENABLED: ${HUNT_BOARD_SCHEDULER_ENABLED:-true}
  HUNT_BOARD_SCHEDULER_INTERVAL_SECONDS: ${HUNT_BOARD_SCHEDULER_INTERVAL_SECONDS:-7200}
  HUNT_BOARD_SCHEDULER_RUN_ON_STARTUP: ${HUNT_BOARD_SCHEDULER_RUN_ON_STARTUP:-true}
  HUNT_BOARD_ANOMALY_ZERO_QUARANTINE: ${HUNT_BOARD_ANOMALY_ZERO_QUARANTINE:-true}
  HUNT_BOARD_ANOMALY_VOLUME_CHANGE_RATIO: ${HUNT_BOARD_ANOMALY_VOLUME_CHANGE_RATIO:-0.75}
  HUNT_BOARD_ANOMALY_MASS_CHANGE_RATIO: ${HUNT_BOARD_ANOMALY_MASS_CHANGE_RATIO:-0.50}
  HUNT_BOARD_MAX_JOB_AGE_DAYS: ${HUNT_BOARD_MAX_JOB_AGE_DAYS:-365}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hunt_board
      POSTGRES_USER: hunt_board
      POSTGRES_PASSWORD: hunt_board
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunt_board -d hunt_board"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      <<: *app-environment
      HUNT_BOARD_PROCESS: web
    command:
      - sh
      - -c
      - alembic upgrade head && python -m hunt_board.cli seed && uvicorn hunt_board.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler:
    profiles: ["scheduler"]
    build: .
    environment:
      <<: *app-environment
      HUNT_BOARD_PROCESS: scheduler
    command: ["hunt-board", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
